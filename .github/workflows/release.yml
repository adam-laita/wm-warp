# Publishes a release when a version tag (v1.2.3) is pushed: checks versions and code,
# builds wm-warp.zip with git archive and attaches it with its SHA-256 (docs: README, Releasing).
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check versions
        run: |
          version="${GITHUB_REF_NAME#v}"
          header=$(sed -n 's/^ \* Version:[[:space:]]*//p' wm-warp.php)
          constant=$(sed -n "s/^const VERSION[[:space:]]*= '\(.*\)';/\1/p" wm-warp.php)
          stable=$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt)
          echo "tag=$version header=$header constant=$constant readme=$stable"
          test "$header" = "$version" && test "$constant" = "$version" && test "$stable" = "$version"

      # actions/checkout replaces the annotated tag with a lightweight one, so the release
      # notes are read from the tag fetched again. Only the tag body is used (no subject,
      # no trailers) and it must be a list of [ADD] / [UPDATE] / [FIX] / [REMOVE] items.
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag || { echo "::error::$GITHUB_REF_NAME is not an annotated tag with release notes."; exit 1; }
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d' > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          grep -qE '^- \[(ADD|UPDATE|FIX|REMOVE)\] ' "$RUNNER_TEMP/notes.md" || { echo "::error::Release notes need lines like '- [ADD] …' (see README, Releasing)."; exit 1; }
          if grep -qiE '^(co-authored-by|signed-off-by):' "$RUNNER_TEMP/notes.md"; then echo "::error::Release notes must not contain commit trailers."; exit 1; fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Checks
        run: |
          composer install --no-interaction --no-progress
          composer check

      - name: Build
        run: |
          git archive --format=zip --prefix=wm-warp/ -o wm-warp.zip HEAD
          sha256sum wm-warp.zip > wm-warp.zip.sha256
          unzip -l wm-warp.zip | tail -1
          cat wm-warp.zip.sha256

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wm-warp.zip wm-warp.zip.sha256 --title "WM Warp ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
